name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Linux
        run: ./build-linux.sh "${GITHUB_REF_NAME#v}"

      - name: Build Linux updater
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-Linux-x64 \
            ./cmd/updater

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p package/PC-Multitool
          cp dist/PC-Gear-Calculator-Linux-x64 package/PC-Multitool/PC-Gear-Calculator
          cp install.sh package/PC-Multitool/install.sh
          chmod +x package/PC-Multitool/PC-Gear-Calculator
          chmod +x package/PC-Multitool/install.sh

          cd package
          zip -r "../dist/PC-Multitool-Linux-x64-v${VERSION}.zip" PC-Multitool

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/PC-Gear-Calculator-Linux-x64
            dist/PC-Gear-Calculator-Updater-Linux-x64
            dist/PC-Multitool-Linux-x64-v*.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build macOS
        run: ./build-macos.sh "${GITHUB_REF_NAME#v}"

      - name: Build macOS updaters
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-macOS-x64 \
            ./cmd/updater

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-macOS-arm64 \
            ./cmd/updater

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/PC-Gear-Calculator-macOS-x64
            dist/PC-Gear-Calculator-macOS-arm64
            dist/PC-Gear-Calculator-Updater-macOS-x64
            dist/PC-Gear-Calculator-Updater-macOS-arm64

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Windows
        shell: bash
        run: ./build-windows.sh "${GITHUB_REF_NAME#v}"

      - name: Build Windows updater
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-Windows-x64.exe \
            ./cmd/updater

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/PC-Gear-Calculator-Windows-x64.exe
            dist/PC-Gear-Calculator-Updater-Windows-x64.exe
            dist/PC-Multitool-Setup-v*.exe

  release:
    needs:
      - build-linux
      - build-macos
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true


      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-files/**
